<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 与桌面黑洞一致的极简吸积盘标记。 -->
  <defs>
    <linearGradient id="disk" x1="0" x2="1">
      <stop offset="0" stop-color="#783a23" />
      <stop offset=".52" stop-color="#f0c08c" />
      <stop offset="1" stop-color="#9c4f2a" />
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="29" fill="#090b0f" />
  <ellipse
    cx="32"
    cy="32"
    rx="27"
    ry="10"
    fill="none"
    stroke="url(#disk)"
    stroke-width="5"
    transform="rotate(-14 32 32)"
  />
  <circle cx="32" cy="32" r="14" fill="#010203" stroke="#b56d3e" stroke-width="1" />
